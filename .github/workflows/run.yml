name: 刷步数

on:
  schedule:
    # UTC 04:00 / 10:00 = Asia/Shanghai 12:00 / 18:00
    - cron: '0 4,10 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Random delay for scheduled runs
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          delay=$((RANDOM % 901))
          echo "Waiting ${delay} seconds before the scheduled run"
          sleep "$delay"
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install requests pytz pycryptodome
          python3 main.py

